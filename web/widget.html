<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
 <title>Sacred Tweaks • Widgets</title>
 <style>
  :root{--accent:#1E90FF;--surface:#0A1220;--ink:#EAF2FF;--muted:#93A7C4}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--surface);color:var(--ink);font:600 12px/1 "Segoe UI Variable","Segoe UI",sans-serif;user-select:none;cursor:default}
  .bar{display:flex;align-items:center;justify-content:space-around;gap:6px;height:100%;padding:0 10px;box-sizing:border-box;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:12px;
   background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 7%,transparent),transparent),var(--surface);box-shadow:inset 0 1px 0 #ffffff1f}
  .pill{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .pill small{color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
  .pill strong{font:700 13px/1 "Cascadia Code",Consolas,monospace}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .on .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .sep{width:1px;height:18px;background:color-mix(in srgb,var(--ink) 18%,transparent)}
 </style>
 <script defer src="widget.js"></script>
</head>
<body>
 <div class="bar" aria-hidden="true">
  <div class="pill"><small>Time</small><strong id="clock">--:--</strong></div><span class="sep"></span>
  <div class="pill" id="timer-pill"><span class="dot"></span><small>Session</small><strong id="timer">0:00</strong></div><span class="sep"></span>
  <div class="pill" id="macro-pill"><span class="dot"></span><small>Macros</small><strong id="macros">–</strong></div>
 </div>
</body>
</html>
