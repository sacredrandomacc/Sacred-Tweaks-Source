name: Windows apps and standalone companion
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build desktop apps
        shell: pwsh
        run: ./build-windows.ps1 -SkipSmokeTest
      - name: Verify executable icon resources
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -c "import pefile; from pathlib import Path; files=list(Path('dist').glob('*/*.exe')); assert len(files)==2; [(print(p),exec('with pefile.PE(str(p)) as pe:\n assert {3,14}.issubset({e.id for e in pe.DIRECTORY_ENTRY_RESOURCE.entries})')) for p in files]"
      - uses: actions/upload-artifact@v4
        with:
          name: Sacred-Windows-Standalone-Overlay
          path: |
            dist/*.zip
            docs/STANDALONE-OVERLAY.md
          if-no-files-found: error
