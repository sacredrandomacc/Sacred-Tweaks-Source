name: Backend tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sacred
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sacred_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sacred -d sacred_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sacred:test-only-password@127.0.0.1:5432/sacred_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
